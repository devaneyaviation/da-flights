<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DA Flights">
<link rel="apple-touch-icon" href="icon-512.png">
<title>DA Flights</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; }
  /* The frame stops above the status bar area and above the home indicator area, and its height
     follows the visible screen (--vh, set below), so Safari's toolbar never covers it. */
  iframe {
    position: fixed; left: 0; width: 100%; border: 0; background: #fff;
    top: env(safe-area-inset-top, 0px);
    height: calc(var(--vh, 100%) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
</style>
<iframe id="app" title="DA Flights" allow="clipboard-write"></iframe>
<script>
(function () {
  // PASTE YOUR WEB APP URL HERE (the one ending in /exec)
  var EXEC = 'https://script.google.com/macros/s/AKfycbx3Nbjwqk8tI2cZbX-PSgYgo5fPdRnace_h0dfpaIDpAWtGSYJ-ujPLgw0BOMYHj2MM/exec';

  function layout() { document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
  window.addEventListener('pageshow', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  document.getElementById('app').src = EXEC;
})();
</script>
